# Skon's USB Tool — local backend services
# ------------------------------------------------------------------------------
# The web app is a static, browser-only site. These containers give its security
# tools capabilities a browser cannot have on its own (cross-origin fetches, real
# port scans, live TLS handshakes, arbitrary DNS). Each tool talks to its own
# service on localhost; configure the URLs in the app's "Docker Backends" panel.
#
#   Start the safe services:      docker compose up -d
#   Include the offensive ones:   docker compose --profile offensive up -d
#   Stop everything:              docker compose down
#
# Ports use an uncommon 471xx block so they don't clash with common dev servers
# (3000/5000/8000/8080/9000) or anything already running.
#
# Only use these against systems you own or are explicitly authorized to assess.
# ------------------------------------------------------------------------------

services:
  # Generic CORS forwarder. Serves the browser-fetch tools: Web Analyzer, HTTP
  # Workbench, API Client, URL Inspector, OSINT clients, crt.sh / Cert Inspect
  # lookups, Pwned Passwords. Also reaches sibling services by name (e.g. zap).
  cors-proxy:
    build: ./cors-proxy
    image: skons-usb-tool/cors-proxy
    container_name: skons-cors-proxy
    ports:
      - "47101:47101"
    environment:
      - PORT=47101
      # - ALLOW_HOSTS=example.com,api.example.com   # optional allowlist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:47101/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Real nmap. Backs the Nmap tool with true service/version detection.
  nmap:
    build: ./nmap
    image: skons-usb-tool/nmap
    container_name: skons-nmap
    ports:
      - "47102:47102"
    environment:
      - PORT=47102
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:47102/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Live TLS certificate chain. Backs Cert Inspect with what the server serves
  # now (vs. what Certificate Transparency recorded).
  tls-inspector:
    build: ./tls-inspector
    image: skons-usb-tool/tls-inspector
    container_name: skons-tls-inspector
    ports:
      - "47103:47103"
    environment:
      - PORT=47103
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:47103/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Arbitrary DNS record lookups against any nameserver. Backs the DNS Toolkit.
  dns:
    build: ./dns
    image: skons-usb-tool/dns
    container_name: skons-dns
    ports:
      - "47104:47104"
    environment:
      - PORT=47104
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:47104/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # OWASP ZAP daemon with its REST API. Backs the OWASP ZAP tool. The browser
  # reaches it through cors-proxy (http://localhost:47101/fetch?url=http://zap:47105/...).
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: skons-zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 47105
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "47105:47105"
    restart: unless-stopped

  # THC-Hydra — AUTHORIZED SECURITY TESTING ONLY. Not started by default; runs
  # only with `--profile offensive` AND requires the authorization flag below.
  hydra:
    build: ./hydra
    image: skons-usb-tool/hydra
    container_name: skons-hydra
    profiles: ["offensive"]
    ports:
      - "47106:47106"
    environment:
      - PORT=47106
      # Set to "yes" to confirm you are authorized to test the targets:
      - I_HAVE_AUTHORIZATION=${I_HAVE_AUTHORIZATION:-no}
    restart: unless-stopped
