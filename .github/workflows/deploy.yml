name: Deploy Skon's USB Tool to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    # Opt-in like the jobs below: without CI_BUILDS_ENABLED=true nothing in this workflow
    # runs (a skipped job uses no runner minutes). Releases go out from a PC with
    # scripts/release-local.py --deploy.
    if: ${{ vars.CI_BUILDS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    # Hosted runs are opt-in: the site is normally tested, built and published from a
    # developer PC with scripts/release-local.py (no build job on GitHub). Set the repo
    # variable CI_BUILDS_ENABLED=true to run this workflow on GitHub again; every other
    # job needs this one, so nothing runs while it is unset.
    if: ${{ vars.CI_BUILDS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
