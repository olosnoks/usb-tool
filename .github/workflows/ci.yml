name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    # Hosted runs are opt-in: the site is normally tested, built and published from a
    # developer PC with scripts/release-local.py (no build job on GitHub). Set the repo
    # variable CI_BUILDS_ENABLED=true to run this workflow on GitHub again; every other
    # job needs this one, so nothing runs while it is unset.
    if: ${{ vars.CI_BUILDS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build (verify production bundle)
        run: npm run build
